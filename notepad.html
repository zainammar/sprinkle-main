    <script>
        function saveFile(content, fileName, fileType) {
            let blob = new Blob([content], { type: fileType });
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }

        function saveAsCSV() {
            let text = document.getElementById("notepad").value;
            let csvContent = `"Notes"
"${text.replace(/"/g, '""')}"`;
            saveFile(csvContent, "notes.csv", "text/csv");
        }

        function saveAsJSON() {
            let text = document.getElementById("notepad").value;
            let jsonContent = JSON.stringify({ notes: text }, null, 2);
            saveFile(jsonContent, "notes.json", "application/json");
        }
    </script>

  <!-- Header Fotter -->
  <script>
  window.addEventListener('DOMContentLoaded', () => {
    // You can change the file names here
    const filesToLoad = {
      content1: 'page1.html',
      content2: 'page2.html'
    };
  
    // Loop through and load each file into its matching div
    for (const [divId, filename] of Object.entries(filesToLoad)) {
      fetch(filename)
        .then(response => {
          if (!response.ok) throw new Error(`File not found: ${filename}`);
          return response.text();
        })
        .then(data => {
          document.getElementById(divId).innerHTML = data;
        })
        .catch(error => {
          document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
        });
    }
  });
  </script>
