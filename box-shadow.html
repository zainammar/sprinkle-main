    <title>Complete Box Shadow Generator</title>
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

     
        .generator {
            max-width: 1100px;
            width: 100%;
      
            border-radius: 24px;
      
            padding: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 span {
            background: #4f46e5;
            color: white;
            font-size: 14px;
            padding: 2px 14px;
            border-radius: 20px;
            font-weight: 500;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* ----- LAYOUT ----- */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 800px) {
            .row {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .generator {
                padding: 20px;
            }
        }

        /* ----- PREVIEW ----- */
        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-box {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1/0.8;
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.15s ease;
            border: 2px dashed #e5e7eb;
            margin-bottom: 20px;
            padding: 20px;
            text-align: center;
        }

        .preview-box .label {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .preview-box .sub-label {
            font-size: 13px;
            color: #9ca3af;
        }

        /* Copy button */
        .copy-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            max-width: 350px;
        }

        .copy-btn:hover {
            background: #4338ca;
        }

        .copy-btn.copied {
            background: #22c55e;
        }

        /* ----- CONTROLS ----- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            display: flex;
            justify-content: space-between;
        }

        .control-group label .value {
            color: #4f46e5;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
     
            background: #e5e7eb;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #4f46e5;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #4f46e5;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            padding: 2px;
            background: white;
        }

        /* Presets */
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .preset-btn {
            padding: 6px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            transition: all 0.15s;
        }

        .preset-btn:hover {
            border-color: #4f46e5;
            color: #4f46e5;
        }

        .preset-btn.active {
            border-color: #4f46e5;
            background: #eef2ff;
            color: #4f46e5;
        }

        /* CSS output */
        .css-output {
            margin-top: 8px;
            background: #1a1a2e;
            color: #e5e7eb;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 60px;
            border: 2px solid transparent;
        }

        .css-output.highlight {
            border-color: #4f46e5;
        }

        /* Checkbox toggle */
        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .toggle-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4f46e5;
            cursor: pointer;
        }

        .toggle-group label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #9ca3af;
        }

        .footer a {
            color: #4f46e5;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>


    <div class="generator">

        <h1>
            🎨 Box Shadow Generator
            <span>Complete</span>
        </h1>
        <p class="subtitle">Adjust the controls below &amp; copy the CSS code instantly.</p>

        <div class="row">

            <!-- ===== LEFT: PREVIEW ===== -->
            <div class="preview-section">
                <div class="preview-box" id="previewBox">
                    <div class="label">Preview</div>
                    <div class="sub-label">adjust the sliders →</div>
                </div>
                <button class="copy-btn" id="copyBtn">📋 Copy CSS</button>
            </div>

            <!-- ===== RIGHT: CONTROLS ===== -->
            <div class="controls">

                <!-- X -->
                <div class="control-group">
                    <label>Offset X <span class="value" id="valX">0</span></label>
                    <input type="range" id="x" min="-60" max="60" value="0" />
                </div>

                <!-- Y -->
                <div class="control-group">
                    <label>Offset Y <span class="value" id="valY">10</span></label>
                    <input type="range" id="y" min="-60" max="60" value="10" />
                </div>

                <!-- Blur -->
                <div class="control-group">
                    <label>Blur <span class="value" id="valBlur">30</span></label>
                    <input type="range" id="blur" min="0" max="100" value="30" />
                </div>

                <!-- Spread -->
                <div class="control-group">
                    <label>Spread <span class="value" id="valSpread">0</span></label>
                    <input type="range" id="spread" min="-40" max="40" value="0" />
                </div>

                <!-- Opacity -->
                <div class="control-group">
                    <label>Opacity <span class="value" id="valOpacity">15</span>%</label>
                    <input type="range" id="opacity" min="0" max="100" value="15" />
                </div>

                <!-- Color -->
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" id="color" value="#000000" />
                </div>

                <!-- Inset toggle -->
                <div class="toggle-group">
                    <input type="checkbox" id="inset" />
                    <label for="inset">🔲 Inset (inner shadow)</label>
                </div>

                <!-- Presets -->
                <div class="control-group">
                    <label>Presets</label>
                    <div class="presets">
                        <button class="preset-btn" data-preset="soft">Soft</button>
                        <button class="preset-btn" data-preset="medium">Medium</button>
                        <button class="preset-btn" data-preset="heavy">Heavy</button>
                        <button class="preset-btn" data-preset="blue">Blue</button>
                        <button class="preset-btn" data-preset="glow">Glow</button>
                        <button class="preset-btn" data-preset="neumo">Neumo</button>
                        <button class="preset-btn" data-preset="inset">Inset</button>
                        <button class="preset-btn" data-preset="none">None</button>
                    </div>
                </div>

                <!-- CSS Output -->
                <div class="control-group">
                    <label>CSS Code</label>
                    <div class="css-output" id="cssOutput">box-shadow: 0 10px 30px rgba(0,0,0,0.15);</div>
                </div>

            </div>
        </div>

  

    <script>
        // ----- DOM refs -----
        const previewBox = document.getElementById('previewBox');
        const cssOutput = document.getElementById('cssOutput');

        const xInput = document.getElementById('x');
        const yInput = document.getElementById('y');
        const blurInput = document.getElementById('blur');
        const spreadInput = document.getElementById('spread');
        const opacityInput = document.getElementById('opacity');
        const colorInput = document.getElementById('color');
        const insetCheck = document.getElementById('inset');

        const valX = document.getElementById('valX');
        const valY = document.getElementById('valY');
        const valBlur = document.getElementById('valBlur');
        const valSpread = document.getElementById('valSpread');
        const valOpacity = document.getElementById('valOpacity');

        const copyBtn = document.getElementById('copyBtn');

        // ----- Presets -----
        const PRESETS = {
            soft: { x: 0, y: 6, blur: 24, spread: 0, opacity: 8, color: '#000000', inset: false },
            medium: { x: 0, y: 10, blur: 30, spread: 0, opacity: 12, color: '#000000', inset: false },
            heavy: { x: 0, y: 20, blur: 60, spread: 0, opacity: 20, color: '#000000', inset: false },
            blue: { x: 0, y: 8, blur: 30, spread: 0, opacity: 30, color: '#3b82f6', inset: false },
            glow: { x: 0, y: 0, blur: 30, spread: 0, opacity: 30, color: '#3b82f6', inset: false },
            neumo: { x: 8, y: 8, blur: 20, spread: 0, opacity: 10, color: '#000000', inset: false },
            inset: { x: 0, y: 4, blur: 10, spread: 0, opacity: 8, color: '#000000', inset: true },
            none: { x: 0, y: 0, blur: 0, spread: 0, opacity: 0, color: '#000000', inset: false },
        };

        // ----- Build shadow string -----
        function buildShadow() {
            const x = parseInt(xInput.value, 10);
            const y = parseInt(yInput.value, 10);
            const blur = parseInt(blurInput.value, 10);
            const spread = parseInt(spreadInput.value, 10);
            const opacity = parseInt(opacityInput.value, 10) / 100;
            const color = colorInput.value;
            const inset = insetCheck.checked;

            // Convert hex to rgb
            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            const rgba = `rgba(${r},${g},${b},${opacity.toFixed(2)})`;

            let parts = [];
            if (inset) parts.push('inset');
            parts.push(`${x}px`);
            parts.push(`${y}px`);
            parts.push(`${blur}px`);
            if (spread !== 0) parts.push(`${spread}px`);
            parts.push(rgba);

            return parts.join(' ');
        }

        // ----- Update preview & output -----
        function update() {
            const shadow = buildShadow();
            previewBox.style.boxShadow = shadow;
            cssOutput.textContent = `box-shadow: ${shadow};`;

            // Update value displays
            valX.textContent = xInput.value;
            valY.textContent = yInput.value;
            valBlur.textContent = blurInput.value;
            valSpread.textContent = spreadInput.value;
            valOpacity.textContent = opacityInput.value;

            // Highlight output briefly
            cssOutput.classList.add('highlight');
            clearTimeout(cssOutput._timer);
            cssOutput._timer = setTimeout(() => {
                cssOutput.classList.remove('highlight');
            }, 300);
        }

        // ----- Apply preset -----
        function applyPreset(name) {
            const p = PRESETS[name];
            if (!p) return;

            xInput.value = p.x;
            yInput.value = p.y;
            blurInput.value = p.blur;
            spreadInput.value = p.spread;
            opacityInput.value = p.opacity;
            colorInput.value = p.color;
            insetCheck.checked = p.inset;

            // Update preset button styles
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.preset === name);
            });

            update();
        }

        // ----- Copy to clipboard -----
        function copyCSS() {
            const text = cssOutput.textContent;
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = '✅ Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy CSS';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Fallback
                const range = document.createRange();
                range.selectNode(cssOutput);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy CSS';
                }, 2000);
            });
        }

        // ----- Reset to defaults -----
        function resetDefaults() {
            applyPreset('medium');
        }

        // ----- Event listeners -----
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                applyPreset(btn.dataset.preset);
            });
        });

        [xInput, yInput, blurInput, spreadInput, opacityInput, colorInput, insetCheck].forEach(el => {
            el.addEventListener('input', update);
        });

        copyBtn.addEventListener('click', copyCSS);

        // ----- Init -----
        applyPreset('medium');
    </script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
