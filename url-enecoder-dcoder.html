<link rel="stylesheet" href="css/drawing.css">
<title>URL Encoder / Decoder</title>
<div id="content1" class="content-box">Loading first file...</div>
      
<div class="row-1 content-grid">
  <div class="grid-item-1">


<style>


textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#007bff;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
}

button{
    flex:1;
    min-width:120px;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    color:#fff;
}

.encode{background:#007bff;}
.decode{background:#28a745;}
.copy{background:#6c757d;}
.clear{background:#dc3545;}

button:hover{
    opacity:.9;
}

.counter{
    text-align:right;
    margin-top:8px;
    color:#777;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

<h1>URL Encoder / Decoder</h1>


<textarea id="input" placeholder="Enter URL or text..."></textarea>

<div class="counter">
Characters:
<span id="count">0</span>
</div>

<div class="buttons">
<button class="encode" id="encodeBtn">Encode</button>
<button class="decode" id="decodeBtn">Decode</button>
<button class="copy" id="copyBtn">Copy</button>
<button class="clear" id="clearBtn">Clear</button>
</div>

<label>Result</label>

<textarea id="output" readonly></textarea>

</div>

<script>
const input=document.getElementById("input");
const output=document.getElementById("output");
const count=document.getElementById("count");

input.addEventListener("input",()=>{
    count.textContent=input.value.length;
});

document.getElementById("encodeBtn").addEventListener("click",()=>{
    output.value=encodeURIComponent(input.value);
});

document.getElementById("decodeBtn").addEventListener("click",()=>{
    try{
        output.value=decodeURIComponent(input.value);
    }catch{
        alert("Invalid encoded URL.");
    }
});

document.getElementById("copyBtn").addEventListener("click",()=>{
    if(!output.value) return;
    navigator.clipboard.writeText(output.value);
});

document.getElementById("clearBtn").addEventListener("click",()=>{
    input.value="";
    output.value="";
    count.textContent="0";
});
</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
