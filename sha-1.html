<title>SHA-1 Hash Generator</title>

<style>
* {
    box-sizing: border-box;
}



.container {
    max-width: 800px;
    margin: 60px auto;
    padding: 20px;
}

.card {

    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 10px 0 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

textarea,
input {
    width: 100%;
    border: 1px solid #d5d9df;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    outline: none;
}

textarea {
    min-height: 180px;
    resize: vertical;
}

textarea:focus,
input:focus {
    border-color: #4f46e5;
}

.counter {
    text-align: right;
    color: #888;
    font-size: 13px;
    margin-top: 5px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.generate {
    background: #4f46e5;
    color: white;
}

.generate:hover {
    background: #4338ca;
}

.clear {
    background: #e5e7eb;
    color: #222;
}

.clear:hover {
    background: #d1d5db;
}

.result {
    margin-top: 25px;
}

.result-box {
    display: flex;
    gap: 10px;
}

.result-box input {
    background: #f8fafc;
    font-family: monospace;
    font-size: 17px;
}

.copy {
    flex: 0 0 100px;
    background: #16a34a;
    color: white;
}

.copy:hover {
    background: #15803d;
}

.status {
    text-align: center;
    margin-top: 12px;
    min-height: 20px;
    font-size: 14px;
}

@media (max-width: 600px) {
    .container {
        margin: 20px auto;
    }

    .card {
        padding: 20px;
    }

    .buttons,
    .result-box {
        flex-direction: column;
    }

    .copy {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>SHA-1 Hash Generator</h1>

        <div class="subtitle">
            Generate a SHA-1 hash from your text instantly.
        </div>

        <label for="inputText">Enter Text</label>

        <textarea
            id="inputText"
            placeholder="Type or paste your text here..."
        ></textarea>

        <div class="counter">
            Characters: <span id="charCount">0</span>
        </div>

        <div class="buttons">

            <button class="generate" onclick="generateSHA1()">
                Generate SHA-1
            </button>

            <button class="clear" onclick="clearAll()">
                Clear
            </button>

        </div>

        <div class="result">

            <label for="hashResult">SHA-1 Hash</label>

            <div class="result-box">

                <input
                    type="text"
                    id="hashResult"
                    readonly
                    placeholder="Your SHA-1 hash will appear here..."
                >

                <button class="copy" onclick="copyHash()">
                    Copy
                </button>

            </div>

            <div class="status" id="status"></div>

        </div>

    </div>

</div>

<script>

const inputText = document.getElementById("inputText");
const charCount = document.getElementById("charCount");
const hashResult = document.getElementById("hashResult");
const status = document.getElementById("status");

inputText.addEventListener("input", function () {
    charCount.textContent = inputText.value.length;
});

async function generateSHA1() {

    const text = inputText.value;

    if (text === "") {
        hashResult.value = "";
        status.style.color = "#dc2626";
        status.textContent = "Please enter some text.";
        return;
    }

    const encoder = new TextEncoder();
    const data = encoder.encode(text);

    const hashBuffer = await crypto.subtle.digest("SHA-1", data);

    const hashArray = Array.from(new Uint8Array(hashBuffer));

    const hash = hashArray
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");

    hashResult.value = hash;

    status.style.color = "#16a34a";
    status.textContent = "SHA-1 hash generated successfully.";
}

function copyHash() {

    if (hashResult.value === "") {
        status.style.color = "#dc2626";
        status.textContent = "Nothing to copy.";
        return;
    }

    navigator.clipboard.writeText(hashResult.value)
        .then(function () {
            status.style.color = "#16a34a";
            status.textContent = "SHA-1 hash copied!";
        })
        .catch(function () {
            hashResult.select();
            document.execCommand("copy");

            status.style.color = "#16a34a";
            status.textContent = "SHA-1 hash copied!";
        });
}

function clearAll() {

    inputText.value = "";
    hashResult.value = "";
    charCount.textContent = "0";
    status.textContent = "";
}

</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
