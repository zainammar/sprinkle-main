<title>CSS Minifier</title>

<style>
textarea{
    width:100%;

    display:flex;
    gap:20px;

    border-radius:6px;

    background:#fafafa;

<div class="row-1 content-grid">
    <div class="grid-item-1">
  

<div class="container">

<h1>CSS Minifier</h1>
<p>Shrink Your CSS. Supercharge Your PageSpeed.</p>
<textarea id="input" placeholder="Paste CSS Here..."></textarea>

<div class="buttons">
<button id="minify">Minify CSS</button>
<button id="copy">Copy</button>
<button id="clear">Clear</button>
</div>

<div class="stats">
<div class="stat">Original: <span id="original">0</span> Bytes</div>
<div class="stat">Minified: <span id="minified">0</span> Bytes</div>
<div class="stat">Saved: <span id="saved">0%</span></div>
</div>

<textarea id="output" placeholder="Minified CSS..." readonly></textarea>

</div></div>


<script>

const input=document.getElementById("input");
const output=document.getElementById("output");

const original=document.getElementById("original");
const minified=document.getElementById("minified");
const saved=document.getElementById("saved");

document.getElementById("minify").onclick=()=>{

let css=input.value;

original.textContent=css.length;

css=css

.replace(/\/\*[\s\S]*?\*\//g,"")
.replace(/\s+/g," ")
.replace(/\s*{\s*/g,"{")
.replace(/\s*}\s*/g,"}")
.replace(/\s*:\s*/g,":")
.replace(/\s*;\s*/g,";")
.replace(/\s*,\s*/g,",")
.replace(/\s*>\s*/g,">")
.replace(/\s*\+\s*/g,"+")
.replace(/\s*~\s*/g,"~")
.replace(/;\}/g,"}")
.trim();

output.value=css;

minified.textContent=css.length;

let reduce=((original.textContent-css.length)/original.textContent)*100;

saved.textContent=isNaN(reduce)?"0%":reduce.toFixed(2)+"%";

};

document.getElementById("copy").onclick=()=>{

navigator.clipboard.writeText(output.value);

alert("Copied!");

};

document.getElementById("clear").onclick=()=>{

input.value="";
output.value="";
original.textContent=0;
minified.textContent=0;
saved.textContent="0%";

};

</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
