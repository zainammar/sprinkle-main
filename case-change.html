<link rel="stylesheet" href="css/drawing.css">
<title>Change Case</title>
<div id="content1" class="content-box">Loading first file...</div>
      
<div class="row-1 content-grid">
  <div class="grid-item-1">

    <div class="container">
      <h2 class="heading-one">Change Text Case</h2>
  
      <input type="text" id="userInput" placeholder="Type something here">
      <br><br>
  
      <button class="buttonA" onclick="toUpperCaseText()">UPPERCASE</button>
      <button class="buttonA" onclick="toLowerCaseText()">lowercase</button>
      <button class="buttonA" onclick="toTitleCaseText()">Title Case</button>
  
      <p><strong style="padding:22PX;">Result:<br></strong> <span id="result"></span></p><br>


    </div>
    <div class="grid-item-1">

      

     </div>
      </div>
  
</div>

<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
    <script>
        function toUpperCaseText() {
            let text = document.getElementById("userInput").value;
            document.getElementById("result").innerText = text.toUpperCase();
        }

        function toLowerCaseText() {
            let text = document.getElementById("userInput").value;
            document.getElementById("result").innerText = text.toLowerCase();
        }

        function toTitleCaseText() {
            let text = document.getElementById("userInput").value;
            document.getElementById("result").innerText = text
                .toLowerCase()
                .replace(/\b\w/g, char => char.toUpperCase());
        }
    </script>
   
</body>
</html>
