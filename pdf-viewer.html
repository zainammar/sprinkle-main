<div id="content1" class="content-box">Loading first file...</div>
  <title>PDF Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
 
    canvas {
      border: 1px solid #ccc;
      margin-top: 20px;
    }
    .controls {
      margin-top: 10px;
    }
    button {
      margin: 5px;
      padding: 8px 12px;
      font-size: 14px;
    }
  </style>
      
      <div class="row-1 content-grid centera">
        <div class="grid-item-1">

          <h1>📄 PDF Viewer</h1>
          <input type="file" id="file-input" accept="application/pdf" />
          <div class="controls">
            <button onclick="prevPage()">⬅️ Prev</button>
            <span>Page: <span id="page-num">1</span> / <span id="page-count">1</span></span>
            <button onclick="nextPage()">➡️ Next</button>
            <button onclick="zoomIn()">🔍 Zoom In</button>
            <button onclick="zoomOut()">🔎 Zoom Out</button>
          </div>
          <canvas id="pdf-canvas"></canvas>
        </div>


      </div>
 


  <script>
    let pdfDoc = null,
        pageNum = 1,
        scale = 1.2,
        canvas = document.getElementById('pdf-canvas'),
        ctx = canvas.getContext('2d');

    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type === "application/pdf") {
        const fileReader = new FileReader();
        fileReader.onload = function () {
          const typedArray = new Uint8Array(this.result);
          pdfjsLib.getDocument(typedArray).promise.then(pdf => {
            pdfDoc = pdf;
            document.getElementById('page-count').textContent = pdf.numPages;
            pageNum = 1;
            renderPage(pageNum);
          });
        };
        fileReader.readAsArrayBuffer(file);
      }
    });

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        const renderCtx = {
          canvasContext: ctx,
          viewport: viewport
        };
        page.render(renderCtx);
        document.getElementById('page-num').textContent = num;
      });
    }

    function prevPage() {
      if (pageNum <= 1) return;
      pageNum--;
      renderPage(pageNum);
    }

    function nextPage() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      renderPage(pageNum);
    }

    function zoomIn() {
      scale += 0.2;
      renderPage(pageNum);
    }

    function zoomOut() {
      if (scale > 0.4) {
        scale -= 0.2;
        renderPage(pageNum);
      }
    }
  </script>

<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
