<title>JSON Minifier</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.card {

    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 10px 0 25px;
}

.editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.editor-box {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 8px;
}

textarea {
    width: 100%;
    height: 420px;
    resize: vertical;
    border: 1px solid #d5d9df;
    border-radius: 10px;
    padding: 15px;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
    line-height: 1.6;
    outline: none;
    background: #fafbfc;
}

textarea:focus {
    border-color: #4f46e5;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.minify {
    background: #4f46e5;
    color: white;
}

.minify:hover {
    background: #4338ca;
}

.format {
    background: #0f766e;
    color: white;
}

.format:hover {
    background: #115e59;
}

.validate {
    background: #2563eb;
    color: white;
}

.validate:hover {
    background: #1d4ed8;
}

.copy {
    background: #16a34a;
    color: white;
}

.copy:hover {
    background: #15803d;
}

.download {
    background: #7c3aed;
    color: white;
}

.download:hover {
    background: #6d28d9;
}

.clear {
    background: #e5e7eb;
    color: #222;
}

.clear:hover {
    background: #d1d5db;
}

.status {
    margin-top: 18px;
    padding: 12px 15px;
    border-radius: 9px;
    background: #f8fafc;
    min-height: 42px;
    font-size: 14px;
}

.success {
    color: #15803d;
}

.error {
    color: #dc2626;
}

.info {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    color: #666;
    font-size: 13px;
}

.stats {
    display: flex;
    gap: 20px;
    margin-top: 15px;
    color: #777;
    font-size: 13px;
}

@media (max-width: 800px) {

    .editor-grid {
        grid-template-columns: 1fr;
    }

    textarea {
        height: 350px;
    }

    .container {
        margin: 20px auto;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>JSON Minifier</h1>

        <div class="subtitle">
            Minify, format and validate your JSON code.
        </div>

        <div class="editor-grid">

            <!-- Input -->
            <div class="editor-box">

                <label for="jsonInput">
                    JSON Input
                </label>

                <textarea
                    id="jsonInput"
                    placeholder='Paste your JSON here...

Example:
{
  "name": "John",
  "age": 30
}'
                ></textarea>

            </div>

            <!-- Output -->
            <div class="editor-box">

                <label for="jsonOutput">
                    Minified JSON
                </label>

                <textarea
                    id="jsonOutput"
                    placeholder="Minified JSON will appear here..."
                    readonly
                ></textarea>

            </div>

        </div>

        <div class="controls">

            <button
                class="minify"
                onclick="minifyJSON()"
            >
                Minify JSON
            </button>

            <button
                class="format"
                onclick="formatJSON()"
            >
                Format JSON
            </button>

            <button
                class="validate"
                onclick="validateJSON()"
            >
                Validate JSON
            </button>

            <button
                class="copy"
                onclick="copyJSON()"
            >
                Copy
            </button>

            <button
                class="download"
                onclick="downloadJSON()"
            >
                Download
            </button>

            <button
                class="clear"
                onclick="clearAll()"
            >
                Clear
            </button>

        </div>

        <div class="stats">
            <span>
                Input: <strong id="inputSize">0</strong> chars
            </span>

            <span>
                Output: <strong id="outputSize">0</strong> chars
            </span>

            <span>
                Saved: <strong id="savedSize">0</strong> chars
            </span>
        </div>

        <div
            id="status"
            class="status"
        >
            Ready.
        </div>

        <div class="info">
            JSON is processed directly in your browser.
            Your data is not uploaded to any server.
        </div>

    </div>

</div>


<script>

const jsonInput = document.getElementById("jsonInput");
const jsonOutput = document.getElementById("jsonOutput");

const status = document.getElementById("status");

const inputSize = document.getElementById("inputSize");
const outputSize = document.getElementById("outputSize");
const savedSize = document.getElementById("savedSize");


/*
    Update Statistics
*/

function updateStats() {

    const inputLength =
        jsonInput.value.length;

    const outputLength =
        jsonOutput.value.length;

    const saved =
        Math.max(
            0,
            inputLength - outputLength
        );

    inputSize.textContent =
        inputLength.toLocaleString();

    outputSize.textContent =
        outputLength.toLocaleString();

    savedSize.textContent =
        saved.toLocaleString();
}


/*
    Minify JSON
*/

function minifyJSON() {

    const text =
        jsonInput.value.trim();

    if (!text) {

        showStatus(
            "Please enter JSON code first.",
            "error"
        );

        return;
    }

    try {

        const parsed =
            JSON.parse(text);

        const minified =
            JSON.stringify(parsed);

        jsonOutput.value =
            minified;

        updateStats();

        showStatus(
            "JSON minified successfully.",
            "success"
        );

    } catch (error) {

        jsonOutput.value = "";

        updateStats();

        showStatus(
            "Invalid JSON: " + error.message,
            "error"
        );
    }
}


/*
    Format JSON
*/

function formatJSON() {

    const text =
        jsonInput.value.trim();

    if (!text) {

        showStatus(
            "Please enter JSON code first.",
            "error"
        );

        return;
    }

    try {

        const parsed =
            JSON.parse(text);

        const formatted =
            JSON.stringify(
                parsed,
                null,
                4
            );

        jsonOutput.value =
            formatted;

        updateStats();

        showStatus(
            "JSON formatted successfully.",
            "success"
        );

    } catch (error) {

        jsonOutput.value = "";

        updateStats();

        showStatus(
            "Invalid JSON: " + error.message,
            "error"
        );
    }
}


/*
    Validate JSON
*/

function validateJSON() {

    const text =
        jsonInput.value.trim();

    if (!text) {

        showStatus(
            "Please enter JSON code first.",
            "error"
        );

        return;
    }

    try {

        JSON.parse(text);

        showStatus(
            "✓ Valid JSON. No syntax errors found.",
            "success"
        );

    } catch (error) {

        showStatus(
            "✕ Invalid JSON: " + error.message,
            "error"
        );
    }
}


/*
    Copy JSON
*/

function copyJSON() {

    const text =
        jsonOutput.value ||
        jsonInput.value;

    if (!text.trim()) {

        showStatus(
            "Nothing to copy.",
            "error"
        );

        return;
    }

    navigator.clipboard
        .writeText(text)
        .then(function() {

            showStatus(
                "JSON copied to clipboard.",
                "success"
            );

        })
        .catch(function() {

            jsonOutput.select();

            document.execCommand("copy");

            showStatus(
                "JSON copied to clipboard.",
                "success"
            );
        });
}


/*
    Download JSON
*/

function downloadJSON() {

    const text =
        jsonOutput.value ||
        jsonInput.value;

    if (!text.trim()) {

        showStatus(
            "Nothing to download.",
            "error"
        );

        return;
    }

    const blob =
        new Blob(
            [text],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "data.json";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    showStatus(
        "JSON file downloaded.",
        "success"
    );
}


/*
    Clear
*/

function clearAll() {

    jsonInput.value = "";

    jsonOutput.value = "";

    updateStats();

    showStatus(
        "Ready.",
        ""
    );
}


/*
    Status Message
*/

function showStatus(message, type) {

    status.textContent =
        message;

    status.className =
        "status";

    if (type) {
        status.classList.add(type);
    }
}


/*
    Live Statistics
*/

jsonInput.addEventListener(
    "input",
    updateStats
);

jsonOutput.addEventListener(
    "input",
    updateStats
);

updateStats();

</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
