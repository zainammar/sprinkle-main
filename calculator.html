<div id="content1" class="content-box">Loading first file...</div>
      




<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator</title>

<style>
    * {
        box-sizing: border-box;
    }

   

    .container {
        width: min(1000px, 94%);
        margin: 40px auto;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        margin: 0 0 8px;
        font-size: 34px;
    }

    .header p {
        margin: 0;
        color: #6b7280;
    }

    .calculator-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .card {
     
        border-color: #000000;
        border-width: 1px;
        border-style: groove;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .card h2 {
        margin: 0 0 20px;
        font-size: 21px;
    }

    .input-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d1d5db;
        border-radius: 9px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    button {
        width: 100%;
        border: none;
        padding: 13px;
        border-radius: 9px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: white;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    .result {
        margin-top: 15px;
        padding: 15px;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 9px;
        display: none;
    }

    .result strong {
        font-size: 20px;
        color: #15803d;
    }

    .full-width {
        grid-column: 1 / -1;
    }

    .actions {
        display: flex;
        gap: 10px;
    }

    .clear-btn {
        background: #6b7280;
    }

    .clear-btn:hover {
        background: #4b5563;
    }

    .copy-btn {
        margin-top: 10px;
        background: #059669;
    }

    .copy-btn:hover {
        background: #047857;
    }

    @media (max-width: 700px) {
        .calculator-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: auto;
        }

        .header h1 {
            font-size: 28px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Percentage Calculator</h1>
        <p>Calculate percentages quickly and easily</p>
    </div>

    <div class="calculator-grid">

        <!-- Calculator 1 -->
        <div class="card">
            <h2>What is X% of Y?</h2>

            <div class="input-group">
                <label>Percentage (%)</label>
                <input type="number" id="percent1" placeholder="e.g. 20">
            </div>

            <div class="input-group">
                <label>Number</label>
                <input type="number" id="number1" placeholder="e.g. 500">
            </div>

            <button onclick="calculatePercentOf()">
                Calculate
            </button>

            <div class="result" id="result1"></div>
        </div>


        <!-- Calculator 2 -->
        <div class="card">
            <h2>X is what % of Y?</h2>

            <div class="input-group">
                <label>Value X</label>
                <input type="number" id="valueX" placeholder="e.g. 50">
            </div>

            <div class="input-group">
                <label>Value Y</label>
                <input type="number" id="valueY" placeholder="e.g. 200">
            </div>

            <button onclick="calculateWhatPercent()">
                Calculate
            </button>

            <div class="result" id="result2"></div>
        </div>


        <!-- Calculator 3 -->
        <div class="card">
            <h2>Percentage Increase / Decrease</h2>

            <div class="input-group">
                <label>Original Value</label>
                <input type="number" id="originalValue" placeholder="e.g. 100">
            </div>

            <div class="input-group">
                <label>New Value</label>
                <input type="number" id="newValue" placeholder="e.g. 125">
            </div>

            <button onclick="calculateChange()">
                Calculate
            </button>

            <div class="result" id="result3"></div>
        </div>


        <!-- Calculator 4 -->
        <div class="card">
            <h2>Percentage Difference</h2>

            <div class="input-group">
                <label>First Value</label>
                <input type="number" id="diffA" placeholder="e.g. 100">
            </div>

            <div class="input-group">
                <label>Second Value</label>
                <input type="number" id="diffB" placeholder="e.g. 120">
            </div>

            <button onclick="calculateDifference()">
                Calculate
            </button>

            <div class="result" id="result4"></div>
        </div>


        <!-- Full Width -->
        <div class="card full-width">

            <h2>Quick Calculator</h2>

            <div class="input-group">
                <label>Enter Percentage</label>
                <input type="number" id="quickPercent" placeholder="e.g. 15">
            </div>

            <div class="input-group">
                <label>Enter Number</label>
                <input type="number" id="quickNumber" placeholder="e.g. 1000">
            </div>

            <div class="actions">
                <button onclick="quickCalculate()">
                    Calculate
                </button>

                <button class="clear-btn" onclick="clearAll()">
                    Clear All
                </button>
            </div>

            <div class="result" id="quickResult"></div>

        </div>

    </div>

</div>


<script>

function formatNumber(number) {
    return Number(number.toFixed(4)).toLocaleString();
}


/* X% of Y */
function calculatePercentOf() {

    const percent = parseFloat(
        document.getElementById("percent1").value
    );

    const number = parseFloat(
        document.getElementById("number1").value
    );

    const resultBox = document.getElementById("result1");

    if (isNaN(percent) || isNaN(number)) {
        showError(resultBox, "Please enter both values.");
        return;
    }

    const result = (percent / 100) * number;

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <strong>${formatNumber(result)}</strong>
        <br>
        ${formatNumber(percent)}% of ${formatNumber(number)}
        = ${formatNumber(result)}
        <button class="copy-btn"
                onclick="copyResult('${result}')">
            Copy Result
        </button>
    `;
}


/* X is what % of Y */
function calculateWhatPercent() {

    const x = parseFloat(
        document.getElementById("valueX").value
    );

    const y = parseFloat(
        document.getElementById("valueY").value
    );

    const resultBox = document.getElementById("result2");

    if (isNaN(x) || isNaN(y)) {
        showError(resultBox, "Please enter both values.");
        return;
    }

    if (y === 0) {
        showError(resultBox, "Y cannot be zero.");
        return;
    }

    const result = (x / y) * 100;

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <strong>${formatNumber(result)}%</strong>
        <br>
        ${formatNumber(x)} is ${formatNumber(result)}% of ${formatNumber(y)}
        <button class="copy-btn"
                onclick="copyResult('${result}%')">
            Copy Result
        </button>
    `;
}


/* Increase / Decrease */
function calculateChange() {

    const original = parseFloat(
        document.getElementById("originalValue").value
    );

    const current = parseFloat(
        document.getElementById("newValue").value
    );

    const resultBox = document.getElementById("result3");

    if (isNaN(original) || isNaN(current)) {
        showError(resultBox, "Please enter both values.");
        return;
    }

    if (original === 0) {
        showError(resultBox, "Original value cannot be zero.");
        return;
    }

    const difference = current - original;
    const percentage = (difference / original) * 100;

    let type;

    if (percentage > 0) {
        type = "Increase";
    } else if (percentage < 0) {
        type = "Decrease";
    } else {
        type = "No Change";
    }

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <strong>${formatNumber(Math.abs(percentage))}% ${type}</strong>
        <br>
        Difference: ${formatNumber(Math.abs(difference))}
        <button class="copy-btn"
                onclick="copyResult('${formatNumber(Math.abs(percentage))}% ${type}')">
            Copy Result
        </button>
    `;
}


/* Percentage Difference */
function calculateDifference() {

    const a = parseFloat(
        document.getElementById("diffA").value
    );

    const b = parseFloat(
        document.getElementById("diffB").value
    );

    const resultBox = document.getElementById("result4");

    if (isNaN(a) || isNaN(b)) {
        showError(resultBox, "Please enter both values.");
        return;
    }

    if ((a + b) === 0) {
        showError(resultBox, "Values cannot both result in zero average.");
        return;
    }

    const result = Math.abs(a - b) /
                   ((Math.abs(a) + Math.abs(b)) / 2) * 100;

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <strong>${formatNumber(result)}%</strong>
        <br>
        Percentage Difference
        <button class="copy-btn"
                onclick="copyResult('${formatNumber(result)}%')">
            Copy Result
        </button>
    `;
}


/* Quick Calculator */
function quickCalculate() {

    const percent = parseFloat(
        document.getElementById("quickPercent").value
    );

    const number = parseFloat(
        document.getElementById("quickNumber").value
    );

    const resultBox = document.getElementById("quickResult");

    if (isNaN(percent) || isNaN(number)) {
        showError(resultBox, "Please enter both values.");
        return;
    }

    const result = percent / 100 * number;

    resultBox.style.display = "block";

    resultBox.innerHTML = `
        <strong>${formatNumber(result)}</strong>
        <br>
        ${formatNumber(percent)}% of ${formatNumber(number)}
        = ${formatNumber(result)}
        <button class="copy-btn"
                onclick="copyResult('${result}')">
            Copy Result
        </button>
    `;
}


/* Error */
function showError(box, message) {

    box.style.display = "block";

    box.innerHTML = `
        <strong style="color:#dc2626;">
            ${message}
        </strong>
    `;
}


/* Copy */
function copyResult(text) {

    navigator.clipboard.writeText(text)
        .then(() => {
            alert("Result copied!");
        })
        .catch(() => {
            alert("Unable to copy result.");
        });
}


/* Clear */
function clearAll() {

    document.querySelectorAll("input").forEach(input => {
        input.value = "";
    });

    document.querySelectorAll(".result").forEach(result => {
        result.style.display = "none";
        result.innerHTML = "";
    });
}

</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
