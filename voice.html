<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Speech & Speech to Text</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

textarea{
    width:100%;
    height:180px;
    resize:vertical;
    padding:12px;
    font-size:16px;
    margin-bottom:10px;
}

.controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin:15px 0;
}

label{
    font-size:14px;
    font-weight:bold;
    display:block;
    margin-bottom:4px;
}

select,input[type=range]{
    width:100%;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

button{
    padding:10px 18px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#0066ff;
    color:#fff;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

button.record{
    background:#ff4444;
}

button.record.recording{
    background:#cc0000;
    animation: pulse 1s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:0.5;}
    100%{opacity:1;}
}

.counter{
    text-align:right;
    font-size:13px;
    color:#555;
}

.status{
    margin-top:15px;
    font-weight:bold;
    color:#0066ff;
}
</style>

</head>
<body>

<div class="container">

<h2>Text to Speech & Speech to Text</h2>

<textarea id="text">
Assalam-o-Alaikum! Welcome to JavaScript Text to Speech.
</textarea>

<div class="counter">
Characters : <span id="count">0</span>
</div>

<div class="controls">

<div>
<label>Voice</label>
<select id="voiceSelect"></select>
</div>

<div>
<label>Language</label>
<select id="lang">
<option value="en-US">English</option>
<option value="ur-PK">Urdu</option>
<option value="hi-IN">Hindi</option>
</select>
</div>

<div>
<label>Speed</label>
<input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
</div>

<div>
<label>Pitch</label>
<input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
</div>

<div>
<label>Volume</label>
<input type="range" id="volume" min="0" max="1" value="1" step="0.1">
</div>

</div>

<div class="buttons">

<button onclick="speak()">▶ Speak</button>

<button onclick="speechSynthesis.pause()">⏸ Pause</button>

<button onclick="speechSynthesis.resume()">▶ Resume</button>

<button onclick="speechSynthesis.cancel()">⏹ Stop</button>

<button id="recordBtn" class="record" onclick="toggleRecording()">🎤 Record</button>

</div>

<div class="status" id="status">
Ready
</div>

</div>

<script>

const textarea=document.getElementById("text");
const counter=document.getElementById("count");
const voiceSelect=document.getElementById("voiceSelect");
const statusDiv=document.getElementById("status");
const recordBtn=document.getElementById("recordBtn");

let voices=[];
let isRecording=false;
let recognition=null;

// Counter for textarea
function updateCounter(){
    counter.innerHTML=textarea.value.length;
}

textarea.addEventListener("input",updateCounter);
updateCounter();

// Load voices for TTS
function loadVoices(){
    voices=speechSynthesis.getVoices();
    voiceSelect.innerHTML="";
    voices.forEach((voice,index)=>{
        const option=document.createElement("option");
        option.value=index;
        option.text=voice.name+" ("+voice.lang+")";
        voiceSelect.appendChild(option);
    });
    let maleIndex=voices.findIndex(v=>
        /david|mark|daniel|alex|fred|guy|male/i.test(v.name)
    );
    if(maleIndex!=-1){
        voiceSelect.value=maleIndex;
    }
}

loadVoices();

if(speechSynthesis.onvoiceschanged!==undefined){
    speechSynthesis.onvoiceschanged=loadVoices;
}

// Text to Speech function
function speak(){
    speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(textarea.value);
    utterance.lang=document.getElementById("lang").value;
    utterance.rate=parseFloat(document.getElementById("rate").value);
    utterance.pitch=parseFloat(document.getElementById("pitch").value);
    utterance.volume=parseFloat(document.getElementById("volume").value);
    utterance.voice=voices[voiceSelect.value];
    utterance.onstart=()=>{
        statusDiv.innerHTML="Speaking...";
    };
    utterance.onend=()=>{
        statusDiv.innerHTML="Completed";
    };
    speechSynthesis.speak(utterance);
}

// ============ SPEECH TO TEXT (RECORD) ============
function toggleRecording() {
    if (!isRecording) {
        startRecording();
    } else {
        stopRecording();
    }
}

function startRecording() {
    // Check if browser supports Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.innerHTML="❌ Your browser does not support Speech Recognition. Please use Chrome or Edge.";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = document.getElementById("lang").value;
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function() {
        isRecording = true;
        recordBtn.classList.add("recording");
        recordBtn.innerHTML = "⏹ Stop Recording";
        statusDiv.innerHTML = "🎤 Recording... Speak now!";
        textarea.value = ""; // Clear previous text
    };

    recognition.onresult = function(event) {
        let finalTranscript = '';
        let interimTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript + ' ';
            } else {
                interimTranscript += transcript;
            }
        }
        
        // Show interim results in real-time
        textarea.value = finalTranscript + interimTranscript;
        updateCounter();
    };

    recognition.onerror = function(event) {
        console.error('Speech recognition error:', event.error);
        if (event.error === 'not-allowed') {
            statusDiv.innerHTML = "❌ Please allow microphone access to record.";
        } else {
            statusDiv.innerHTML = "❌ Error: " + event.error;
        }
        stopRecording();
    };

    recognition.onend = function() {
        stopRecording();
    };

    recognition.start();
}

function stopRecording() {
    if (recognition) {
        recognition.stop();
        recognition = null;
    }
    isRecording = false;
    recordBtn.classList.remove("recording");
    recordBtn.innerHTML = "🎤 Record";
    statusDiv.innerHTML = "✅ Recording stopped";
}

// Clean up on page unload
window.addEventListener('beforeunload', function() {
    if (recognition) {
        recognition.stop();
    }
    speechSynthesis.cancel();
});

</script>

</body>
</html>
