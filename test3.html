<title>JavaScript Beautifier</title>

<!-- js-beautify Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}



.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}


textarea{
    width:100%;
    height:450px;
    padding:15px;
    border:1px solid #000000;
    border-radius:10px;
    resize:vertical;
    font-family:Consolas, monospace;
    font-size:14px;
}

.dark{
    background:#023cba;
    color:white;
}

.dark .container{
    background:#2a2a2a;
}

.dark textarea{
    background:#111;
    color:#fff;
    border:1px solid #444;
}
</style>
</head>
<body>

<div class="container">
    <h1>JavaScript Beautifier</h1>

    <div class="toolbar">
        <button onclick="beautifyCode()">Beautify</button>
        <button onclick="minifyCode()">Minify</button>

        <select id="indent">
            <option value="2">2 Spaces</option>
            <option value="4" selected>4 Spaces</option>
        </select>

        <button onclick="copyCode()">Copy</button>
        <button onclick="clearCode()">Clear</button>
        <button onclick="downloadCode()">Download</button>

        <input type="file" id="uploadFile" accept=".js">
        
        <button onclick="toggleDark()">Dark Mode</button>
    </div>

    <textarea id="code" placeholder="Paste JavaScript code here..."></textarea>
</div>

<script>
const codeArea = document.getElementById("code");

function beautifyCode(){
    try{
        let indent = parseInt(document.getElementById("indent").value);

        let result = js_beautify(codeArea.value,{
            indent_size: indent,
            space_in_empty_paren: true
        });

        codeArea.value = result;
    }catch(e){
        alert("Invalid JavaScript");
    }
}

function minifyCode(){
    try{
        let code = codeArea.value;

        code = code.replace(/\/\*[\s\S]*?\*\//g,'');
        code = code.replace(/\/\/.*$/gm,'');
        code = code.replace(/\s+/g,' ');

        codeArea.value = code.trim();
    }catch(e){
        alert("Error");
    }
}

function copyCode(){
    navigator.clipboard.writeText(codeArea.value);
    alert("Copied");
}

function clearCode(){
    codeArea.value = "";
}

function downloadCode(){
    const blob = new Blob([codeArea.value], {type:'text/javascript'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "beautified.js";
    a.click();
}

document.getElementById("uploadFile").addEventListener("change", function(e){
    const file = e.target.files[0];

    if(file){
        const reader = new FileReader();
        reader.onload = function(ev){
            codeArea.value = ev.target.result;
        };
        reader.readAsText(file);
    }
});

function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>


<div id="content2" class="content-box">Loading second file...</div>
<!-- Header Fotter -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // You can change the file names here
  const filesToLoad = {
    content1: 'page1.html',
    content2: 'page2.html'
  };

  // Loop through and load each file into its matching div
  for (const [divId, filename] of Object.entries(filesToLoad)) {
    fetch(filename)
      .then(response => {
        if (!response.ok) throw new Error(`File not found: ${filename}`);
        return response.text();
      })
      .then(data => {
        document.getElementById(divId).innerHTML = data;
      })
      .catch(error => {
        document.getElementById(divId).innerHTML = `<p style="color:red">${error.message}</p>`;
      });
  }
});
</script>
